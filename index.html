<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9FBFA" />
    <meta
      name="description"
      content="Ntaka - learn Yoruba, Igbo, Hausa, Swahili, Amharic, Zulu and more with native African-language teachers. 1-on-1 lessons, group classes and self-paced video courses."
    />
    <title>Ntaka | Learn African languages with native teachers</title>

    <link rel="preload" as="image" href="/hero-greeting-poster.webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Day mode is the default. Dark is applied before first paint only when the visitor
      has explicitly chosen it, so there is no flash of the wrong theme on reload.
      OS preference is deliberately not consulted.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          if (localStorage.getItem('ntaka.theme') === 'dark') {
            root.classList.add('dark');
          }
        } catch (e) {
          /* storage blocked - stay on the light default */
        }

        /*
          Reading preferences, applied before first paint for the same reason as the
          theme: someone who needs 150% text should never see a flash of 100% first.

          The attribute names are duplicated from
          src/features/personalization/preferences.js rather than imported, because this
          runs before any module loads. scripts/personalization-check.jsx asserts the two
          lists match, so they cannot drift apart silently.
        */
        var ATTRS = {
          textScale: ['data-pref-text', '100'],
          lineHeight: ['data-pref-leading', 'normal'],
          letterSpacing: ['data-pref-tracking', 'normal'],
          font: ['data-pref-font', 'default'],
          contrast: ['data-pref-contrast'],
          grayscale: ['data-pref-grayscale'],
          reduceMotion: ['data-pref-motion'],
          highlightLinks: ['data-pref-links'],
          bigCursor: ['data-pref-cursor'],
          readingRuler: ['data-pref-ruler'],
          toneMarks: ['data-pref-tones']
        };

        try {
          var raw = localStorage.getItem('ntaka.reading.v1');
          var prefs = raw ? JSON.parse(raw) : null;

          if (!prefs) {
            /* Nothing saved: honour what the operating system already says. */
            prefs = {};
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
              prefs.reduceMotion = true;
            }
            if (window.matchMedia('(prefers-contrast: more)').matches) {
              prefs.contrast = true;
            }
          }

          for (var key in ATTRS) {
            var spec = ATTRS[key];
            var value = prefs[key];
            if (spec.length === 1) {
              if (value === true) root.setAttribute(spec[0], 'on');
            } else if (value && value !== spec[1]) {
              root.setAttribute(spec[0], String(value));
            }
          }
        } catch (e) {
          /* storage blocked or malformed - the defaults are correct */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
